<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="document-flow-title document-flow-description" focusable="false" height="666" id="document-flow-figure" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 352 666" width="352">
  <title id="document-flow-title">Bounded documentation assembly</title>
  <desc id="document-flow-description">An authored Markdown page flows down the center. A marked source region passes through an allowlist funnel on the left, and a passive vector passes through a safe SVG shield on the right. Blocked material stops at each gate. The accepted pieces join the page, pass the checked-build gate, and become a stack of static site data.</desc>
  <g id="authored-page">
    <path d="M86 16 H230 L266 52 V140 H86 Z" fill="#FFFFFF" stroke="#26364A" stroke-linejoin="round" stroke-width="2.5" />
    <path d="M230 16 V52 H266" fill="none" stroke="#26364A" stroke-linejoin="round" stroke-width="2.5" />
    <text fill="#172033" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="176" y="48">page.md</text>
    <rect fill="#EAF0FF" height="25" rx="5" stroke="#275BD8" stroke-width="2" width="142" x="105" y="66" />
    <text fill="#173F9E" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" x="176" y="84">#snippet region</text>
    <rect fill="#E5F8F4" height="25" rx="5" stroke="#087E75" stroke-width="2" width="142" x="105" y="102" />
    <text fill="#075E58" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" x="176" y="120">figure.svg</text>
  </g>
  <g id="direct-render-path">
    <path d="M176 140 V335" fill="none" stroke="#275BD8" stroke-linecap="round" stroke-width="4" />
    <rect fill="#FFFFFF" height="24" rx="4" width="66" x="143" y="148" />
    <text fill="#173F9E" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="176" y="166">render</text>
    <polygon fill="#275BD8" points="168,328 176,342 184,328" />
  </g>
  <g id="source-input">
    <text fill="#172033" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="78" y="190">source file</text>
    <path d="M35 199 H96 L108 211 V243 H35 Z" fill="#F7FAFF" stroke="#526174" stroke-linejoin="round" stroke-width="2" />
    <path d="M96 199 V211 H108" fill="none" stroke="#526174" stroke-width="2" />
    <line stroke="#526174" stroke-linecap="round" stroke-width="2" x1="48" x2="91" y1="218" y2="218" />
    <line stroke="#275BD8" stroke-linecap="round" stroke-width="3" x1="48" x2="83" y1="229" y2="229" />
  </g>
  <g id="source-boundary">
    <path d="M22 250 H134 L99 301 H57 Z" fill="#EAF0FF" stroke="#314158" stroke-linejoin="round" stroke-width="2.5" />
    <text fill="#173F9E" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="78" y="276">allowlist</text>
  </g>
  <g id="source-extraction">
    <rect fill="#FFFFFF" height="32" rx="4" stroke="#275BD8" stroke-width="2" width="64" x="46" y="307" />
    <line stroke="#275BD8" stroke-linecap="round" stroke-width="2.5" x1="57" x2="98" y1="318" y2="318" />
    <line stroke="#275BD8" stroke-linecap="round" stroke-width="2.5" x1="57" x2="88" y1="328" y2="328" />
    <path d="M110 323 C132 323 139 346 162 346" fill="none" stroke="#275BD8" stroke-linecap="round" stroke-width="4" />
    <polygon fill="#275BD8" points="151,338 164,346 151,354" />
  </g>
  <g id="source-rejection">
    <path d="M119 274 L139 294" fill="none" stroke="#A23A35" stroke-dasharray="5 5" stroke-linecap="round" stroke-width="3" />
    <line stroke="#A23A35" stroke-linecap="round" stroke-width="3" x1="132" x2="146" y1="287" y2="301" />
    <line stroke="#A23A35" stroke-linecap="round" stroke-width="3" x1="146" x2="132" y1="287" y2="301" />
  </g>
  <g id="figure-input">
    <text fill="#172033" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="274" y="190">figure.svg</text>
    <circle cx="249" cy="220" fill="#FFFFFF" r="17" stroke="#087E75" stroke-width="2" />
    <polygon fill="#E5F8F4" points="273,238 291,202 309,238" stroke="#087E75" stroke-linejoin="round" stroke-width="2" />
  </g>
  <g id="figure-boundary">
    <path d="M216 250 H332 V275 C332 301 308 320 274 329 C240 320 216 301 216 275 Z" fill="#E5F8F4" stroke="#314158" stroke-linejoin="round" stroke-width="2.5" />
    <text fill="#075E58" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="274" y="278">safe SVG</text>
  </g>
  <g id="figure-validation">
    <polygon fill="#FFFFFF" points="264,314 274,294 284,314" stroke="#087E75" stroke-linejoin="round" stroke-width="2" />
    <path d="M259 323 C239 323 219 346 190 346" fill="none" stroke="#087E75" stroke-linecap="round" stroke-width="4" />
    <polygon fill="#087E75" points="201,338 188,346 201,354" />
  </g>
  <g id="figure-rejection">
    <path d="M324 273 L341 290" fill="none" stroke="#A23A35" stroke-dasharray="5 5" stroke-linecap="round" stroke-width="3" />
    <line stroke="#A23A35" stroke-linecap="round" stroke-width="3" x1="333" x2="347" y1="283" y2="297" />
    <line stroke="#A23A35" stroke-linecap="round" stroke-width="3" x1="347" x2="333" y1="283" y2="297" />
  </g>
  <g id="composition-point">
    <circle cx="176" cy="346" fill="#172033" r="12" />
    <path d="M176 358 V373" fill="none" stroke="#172033" stroke-linecap="round" stroke-width="4" />
    <polygon fill="#172033" points="168,368 176,380 184,368" />
  </g>
  <g id="rendered-page">
    <path d="M80 380 H232 L270 418 V518 H80 Z" fill="#F7FAFF" stroke="#26364A" stroke-linejoin="round" stroke-width="2.5" />
    <path d="M232 380 V418 H270" fill="none" stroke="#26364A" stroke-linejoin="round" stroke-width="2.5" />
    <text fill="#172033" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="170" y="415">rendered page</text>
    <rect fill="#EAF0FF" height="51" rx="5" stroke="#275BD8" stroke-width="2" width="68" x="101" y="437" />
    <line stroke="#275BD8" stroke-linecap="round" stroke-width="2.5" x1="113" x2="157" y1="452" y2="452" />
    <line stroke="#275BD8" stroke-linecap="round" stroke-width="2.5" x1="113" x2="146" y1="463" y2="463" />
    <line stroke="#275BD8" stroke-linecap="round" stroke-width="2.5" x1="113" x2="152" y1="474" y2="474" />
    <circle cx="207" cy="461" fill="#FFFFFF" r="17" stroke="#087E75" stroke-width="2" />
    <polygon fill="#E5F8F4" points="220,479 238,443 256,479" stroke="#087E75" stroke-linejoin="round" stroke-width="2" />
    <text fill="#173F9E" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" x="135" y="508">excerpt</text>
    <text fill="#075E58" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" x="225" y="508">vector</text>
  </g>
  <g id="checked-build-gate">
    <line stroke="#314158" stroke-linecap="round" stroke-width="4" x1="112" x2="162" y1="550" y2="550" />
    <line stroke="#314158" stroke-linecap="round" stroke-width="4" x1="190" x2="240" y1="550" y2="550" />
    <text fill="#314158" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="248" y="555">check</text>
  </g>
  <g id="publication-path">
    <path d="M176 518 V575" fill="none" stroke="#172033" stroke-linecap="round" stroke-width="4" />
    <polygon fill="#172033" points="168,566 176,580 184,566" />
  </g>
  <g id="static-output">
    <path d="M104 574 H244 L258 588 V630 H104 Z" fill="#D8E1EF" stroke="#526174" stroke-linejoin="round" stroke-width="2" />
    <path d="M92 584 H232 L246 598 V642 H92 Z" fill="#E5F8F4" stroke="#526174" stroke-linejoin="round" stroke-width="2" />
    <path d="M80 594 H220 L234 608 V654 H80 Z" fill="#FFFFFF" stroke="#26364A" stroke-linejoin="round" stroke-width="2.5" />
    <path d="M220 594 V608 H234" fill="none" stroke="#26364A" stroke-width="2.5" />
    <text fill="#172033" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="157" y="628">static site data</text>
  </g>
</svg>
